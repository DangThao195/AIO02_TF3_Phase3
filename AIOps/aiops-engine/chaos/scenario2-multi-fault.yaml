apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: recommendation-cpu-noise
  namespace: techx-tf3
spec:
  mode: all
  duration: 10m
  selector:
    namespaces:
      - techx-tf3
    labelSelectors:
      app.kubernetes.io/name: recommendation
  containerNames:
    - recommendation
  stressors:
    cpu:
      workers: 2
      load: 80
---
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: payment-delay-chaos
  namespace: techx-tf3
spec:
  action: delay
  mode: all
  duration: 10m
  selector:
    namespaces:
      - techx-tf3
    labelSelectors:
      app.kubernetes.io/name: payment
  delay:
    latency: 5000ms
    jitter: 0ms
